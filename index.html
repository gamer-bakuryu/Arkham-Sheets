<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallKeeper - Fichas de Chamado de Cthulhu 7ed</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ===== TELA DE LOGIN ===== -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="login-header">
                <h1 class="logo-title">CallKeeper</h1>
                <p class="logo-subtitle">Gerenciador de Fichas — Chamado de Cthulhu 7ª Edição</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-user">Usuário</label>
                    <input type="text" id="login-user" required minlength="3" maxlength="30" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-pass">Senha</label>
                    <input type="password" id="login-pass" required minlength="4" maxlength="50" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Entrar</button>
                <button type="button" id="btn-register" class="btn btn-secondary btn-full">Criar Conta</button>
                <p id="login-error" class="error-msg"></p>
            </form>
            <div class="login-footer">
                <p>Dados salvos localmente no navegador.</p>
            </div>
        </div>
    </div>

    <!-- ===== TELA DE LISTA DE FICHAS ===== -->
    <div id="sheets-screen" class="screen">
        <header class="app-header">
            <h1 class="header-logo">CallKeeper</h1>
            <div class="header-actions">
                <span id="logged-user-display" class="user-display"></span>
                <button id="btn-export-all" class="btn btn-small btn-secondary" title="Exportar todas as fichas">Exportar</button>
                <label class="btn btn-small btn-secondary" title="Importar fichas">
                    Importar
                    <input type="file" id="btn-import-all" accept=".json" style="display:none">
                </label>
                <button id="btn-logout" class="btn btn-small btn-danger">Sair</button>
            </div>
        </header>
        <main class="sheets-main">
            <div class="sheets-toolbar">
                <h2>Minhas Fichas</h2>
                <button id="btn-new-sheet" class="btn btn-primary">+ Nova Ficha</button>
            </div>
            <div id="sheets-list" class="sheets-grid">
                <!-- Cards de fichas serão inseridos via JS -->
            </div>
            <div id="no-sheets-msg" class="empty-state">
                <p>Nenhuma ficha criada ainda.</p>
                <p>Clique em <strong>"+ Nova Ficha"</strong> para começar.</p>
            </div>
        </main>
    </div>

    <!-- ===== TELA DE EDIÇÃO DE FICHA ===== -->
    <div id="editor-screen" class="screen">
        <header class="app-header">
            <div class="header-left">
                <button id="btn-back-to-list" class="btn btn-small btn-secondary">← Voltar</button>
                <h1 class="header-logo">CallKeeper</h1>
            </div>
            <div class="header-actions">
                <button id="btn-export-sheet" class="btn btn-small btn-secondary">Exportar Ficha</button>
                <button id="btn-delete-sheet" class="btn btn-small btn-danger">Excluir Ficha</button>
            </div>
        </header>

        <!-- ABAS DE NAVEGAÇÃO -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="tab-main">Principal</button>
            <button class="tab-btn" data-tab="tab-skills">Perícias</button>
            <button class="tab-btn" data-tab="tab-inventory">Inventário</button>
            <button class="tab-btn" data-tab="tab-weapons">Armas</button>
            <button class="tab-btn" data-tab="tab-magic">Magia</button>
            <button class="tab-btn" data-tab="tab-relations">Relações</button>
        </nav>

        <main class="editor-main">
